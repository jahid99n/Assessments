AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Smart Expense Tracker - Sydney, local preparation only
Parameters:
  ProjectName:
    Type: String
    Default: smart-expense
    AllowedPattern: '[a-z][a-z0-9-]{2,24}'
  FrontendOrigin:
    Type: String
    AllowedPattern: 'https://[a-zA-Z0-9.-]+'
    Description: Exact Amplify HTTPS origin, without trailing slash
  PrivateEmailEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['false', 'true']
    Description: Enable only after the documented account/IAM and two-user isolation checks
Rules:
  SydneyOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-southeast-2]
        AssertDescription: Deploy in Sydney
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    CodeUri: ../code/backend/
    MemorySize: 256
    Timeout: 60
    Environment:
      Variables:
        EXPENSES_TABLE: !Ref Expenses
        BUDGETS_TABLE: !Ref Budgets
        BUCKET: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts'
        TOPIC_ARN: !Ref Alerts
        ALLOWED_ORIGIN: !Ref FrontendOrigin
        PRIVATE_EMAIL_ENABLED: !Ref PrivateEmailEnabled
Resources:
  Expenses:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: userId, AttributeType: S}
        - {AttributeName: expenseId, AttributeType: S}
      KeySchema:
        - {AttributeName: userId, KeyType: HASH}
        - {AttributeName: expenseId, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}
  Budgets:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: userId, AttributeType: S}]
      KeySchema: [{AttributeName: userId, KeyType: HASH}]
      SSESpecification: {SSEEnabled: true}
  Receipts:
    Type: AWS::S3::Bucket
    DependsOn: ProcessorInvokePermission
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts'
      VersioningConfiguration: {Status: Enabled}
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ProcessorFunction.Arn
            Filter: {S3Key: {Rules: [{Name: prefix, Value: receipts/}]}}
      OwnershipControls: {Rules: [{ObjectOwnership: BucketOwnerEnforced}]}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [POST, GET, HEAD]
            AllowedHeaders: [Content-Type]
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ReceiptRetention
            Status: Enabled
            Prefix: receipts/
            ExpirationInDays: 365
            NoncurrentVersionExpiration: {NoncurrentDays: 365}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
  ReceiptPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Receipts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt Receipts.Arn, !Sub '${Receipts.Arn}/*']
            Condition: {Bool: {'aws:SecureTransport': 'false'}}
  Users:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${ProjectName}-users'
      UserPoolTags: {Deployment: ict5205-expenses}
      UserPoolTier: ESSENTIALS
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration: {CaseSensitive: false}
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]
      UserAttributeUpdateSettings: {AttributesRequireVerificationBeforeUpdate: [email]}
  UserClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref Users
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Sub '${FrontendOrigin}/auth/callback']
      LogoutURLs: [!Sub '${FrontendOrigin}/login']
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 1
      TokenValidityUnits: {AccessToken: minutes, IdToken: minutes, RefreshToken: days}
  UserDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${AWS::AccountId}'
      UserPoolId: !Ref Users
      ManagedLoginVersion: 2
  LoginBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref Users
      ClientId: !Ref UserClient
      UseCognitoProvidedValues: true
  Alerts:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ProjectName}-expense-alerts'
  AlertsPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics: [!Ref Alerts]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnlyApplicationPublishers
            Effect: Deny
            Principal: '*'
            Action: sns:Publish
            Resource: !Ref Alerts
            Condition:
              ArnNotEquals:
                aws:PrincipalArn: [!GetAtt ApiRole.Arn, !GetAtt ProcessorRole.Arn, !GetAtt SummaryRole.Arn]
          - Sid: OnlyCoordinatedSubscriptions
            Effect: Deny
            Principal: '*'
            Action: sns:Subscribe
            Resource: !Ref Alerts
            Condition:
              ArnNotEquals: {aws:PrincipalArn: !GetAtt ApiRole.Arn}
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${Users}'
              audience: [!Ref UserClient]
      CorsConfiguration:
        AllowOrigins: [!Ref FrontendOrigin]
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 300
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt ApiLogs.Arn
        Format: '{"requestId":"$context.requestId","route":"$context.routeKey","status":"$context.status","integrationError":"$context.integrationErrorMessage"}'
  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ApiFunctionLogs
    Properties:
      FunctionName: !Sub '${ProjectName}-expense-api'
      Handler: expense_api.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 29
      Events:
        Create: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /expenses, Method: POST, PayloadFormatVersion: '2.0'}}
        List: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /expenses, Method: GET, PayloadFormatVersion: '2.0'}}
        Detail: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/expenses/{id}', Method: GET, PayloadFormatVersion: '2.0'}}
        Edit: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/expenses/{id}', Method: PUT, PayloadFormatVersion: '2.0'}}
        Delete: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/expenses/{id}', Method: DELETE, PayloadFormatVersion: '2.0'}}
        Stats: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /stats, Method: GET, PayloadFormatVersion: '2.0'}}
        GetBudget: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /budget, Method: GET, PayloadFormatVersion: '2.0'}}
        PutBudget: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /budget, Method: PUT, PayloadFormatVersion: '2.0'}}
        Upload: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /upload-url, Method: POST, PayloadFormatVersion: '2.0'}}
  ProcessorFunction:
    Type: AWS::Serverless::Function
    DependsOn: ProcessorLogs
    Properties:
      FunctionName: !Sub '${ProjectName}-receipt-processor'
      Handler: receipt_processor.handler
      Role: !GetAtt ProcessorRole.Arn
      EventInvokeConfig: {MaximumEventAgeInSeconds: 21600, MaximumRetryAttempts: 2}
  ProcessorInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessorFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts'
  SummaryFunction:
    Type: AWS::Serverless::Function
    DependsOn: SummaryLogs
    Properties:
      FunctionName: !Sub '${ProjectName}-weekly-summary'
      Handler: weekly_summary.handler
      Role: !GetAtt SummaryRole.Arn
      EventInvokeConfig: {MaximumEventAgeInSeconds: 21600, MaximumRetryAttempts: 2}
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ExpenseTracker-BoundaryApiRole'
      AssumeRolePolicyDocument: &lambdaTrust
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
      Policies:
        - PolicyName: ApiData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt Expenses.Arn
              - &budgetWrite
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Budgets.Arn
              - &snsReadPublish
                Effect: Allow
                Action: [sns:Publish, sns:ListSubscriptionsByTopic, sns:GetSubscriptionAttributes]
                Resource: !Ref Alerts
              - Effect: Allow
                Action: [sns:Subscribe, sns:Unsubscribe]
                Resource: !Ref Alerts
              - Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:GetObjectVersion, s3:DeleteObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts/receipts/*'
              - Effect: Allow
                Action: s3:ListBucketVersions
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts'
                Condition: {StringLike: {'s3:prefix': 'receipts/*'}}
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-expense-api:*'
  ProcessorRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ExpenseTracker-BoundaryProcessorRole'
      AssumeRolePolicyDocument: *lambdaTrust
      Policies:
        - PolicyName: ReceiptData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt Expenses.Arn
              - *budgetWrite
              - *snsReadPublish
              - Effect: Allow
                Action: [s3:GetObjectVersion, s3:DeleteObjectVersion]
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ProjectName}-${AWS::AccountId}-${AWS::Region}-receipts/receipts/*'
              - Effect: Allow
                Action: textract:AnalyzeExpense
                Resource: '*'
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-receipt-processor:*'
  SummaryRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ExpenseTracker-BoundarySummaryRole'
      AssumeRolePolicyDocument: *lambdaTrust
      Policies:
        - PolicyName: SummaryData
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt Expenses.Arn
              - *budgetWrite
              - Effect: Allow
                Action: dynamodb:Scan
                Resource: !GetAtt Budgets.Arn
              - *snsReadPublish
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ProjectName}-weekly-summary:*'
  ScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      PermissionsBoundary: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/ExpenseTracker-BoundarySchedulerRole'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: scheduler.amazonaws.com}
            Action: sts:AssumeRole
            Condition:
              StringEquals: {'aws:SourceAccount': !Ref 'AWS::AccountId'}
              ArnEquals: {'aws:SourceArn': !GetAtt ScheduleGroup.Arn}
      Policies:
        - PolicyName: InvokeSummary
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'lambda:InvokeFunction', Resource: !GetAtt SummaryFunction.Arn}]
  WeeklySchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      GroupName: !Ref ScheduleGroup
      ScheduleExpression: 'cron(0 9 ? * MON *)'
      ScheduleExpressionTimezone: Australia/Sydney
      FlexibleTimeWindow: {Mode: 'OFF'}
      State: ENABLED
      Target:
        Arn: !GetAtt SummaryFunction.Arn
        RoleArn: !GetAtt SchedulerRole.Arn
        Input: '{"scheduledTime":"<aws.scheduler.scheduled-time>"}'
        RetryPolicy: {MaximumEventAgeInSeconds: 21600, MaximumRetryAttempts: 2}
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 14}
  ApiFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${ProjectName}-expense-api', RetentionInDays: 14}
  ProcessorLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${ProjectName}-receipt-processor', RetentionInDays: 14}
  SummaryLogs:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub '/aws/lambda/${ProjectName}-weekly-summary', RetentionInDays: 14}
  ProcessorErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ProcessorFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  NotificationFailures:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ApiFunctionLogs
      FilterPattern: '?notification_blocked_or_failed ?notification_delivery_unknown ?budget_check_failed ?api_failure'
      MetricTransformations:
        - MetricNamespace: SmartExpense
          MetricName: !Sub '${ProjectName}-notification-failures'
          MetricValue: '1'
  ProcessorNotificationFailures:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref ProcessorLogs
      FilterPattern: '?notification_blocked_or_failed ?notification_delivery_unknown ?budget_check_failed ?receipt_failure_state_unavailable'
      MetricTransformations:
        - MetricNamespace: SmartExpense
          MetricName: !Sub '${ProjectName}-notification-failures'
          MetricValue: '1'
  SummaryNotificationFailures:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref SummaryLogs
      FilterPattern: '?notification_blocked_or_failed ?notification_delivery_unknown ?weekly_user_failed'
      MetricTransformations:
        - MetricNamespace: SmartExpense
          MetricName: !Sub '${ProjectName}-notification-failures'
          MetricValue: '1'
  NotificationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: SmartExpense
      MetricName: !Sub '${ProjectName}-notification-failures'
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  ApiErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref ApiFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
  SummaryErrors:
    Type: AWS::CloudWatch::Alarm
    Properties:
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref SummaryFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
Outputs:
  ApiUrl: {Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'}
  UserPoolId: {Value: !Ref Users}
  UserClientId: {Value: !Ref UserClient}
  CognitoDomain: {Value: !Sub '${UserDomain}.auth.${AWS::Region}.amazoncognito.com'}
  ReceiptBucket: {Value: !Ref Receipts}
  ExpensesTable: {Value: !Ref Expenses}
  BudgetsTable: {Value: !Ref Budgets}
  AlertsTopic: {Value: !Ref Alerts}
  WeeklyScheduleName: {Value: !Ref WeeklySchedule}
  WeeklyScheduleGroup: {Value: !Ref ScheduleGroup}
