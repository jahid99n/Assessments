<circle cx="51" cy="1085" r="11" fill="#2563EB"/><text x="51" y="1089.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<text x="70" y="1090" font-size="13" fill="#374151">API Gateway checks the JWT and invokes expense-api</text>
<circle cx="51" cy="1115" r="11" fill="#2563EB"/><text x="51" y="1119.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
