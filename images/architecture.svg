<text x="40" y="968" font-size="15" font-weight="700" fill="#111827">Step-by-step</text>
<circle cx="51" cy="995" r="11" fill="#2563EB"/><text x="51" y="999.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="70" y="1000" font-size="13" fill="#374151">User opens the web app hosted on Amplify</text>
<circle cx="51" cy="1025" r="11" fill="#2563EB"/><text x="51" y="1029.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<text x="70" y="1030" font-size="13" fill="#374151">User signs in with Cognito and receives a JWT</text>
