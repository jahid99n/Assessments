<circle cx="571" cy="995" r="11" fill="#2563EB"/><text x="571" y="999.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text>
<text x="590" y="1000" font-size="13" fill="#374151">Browser uploads the receipt photo straight to S3</text>
<circle cx="571" cy="1025" r="11" fill="#ED7100"/><text x="571" y="1029.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
<text x="590" y="1030" font-size="13" fill="#374151">S3 upload event triggers receipt-processor</text>
<circle cx="571" cy="1055" r="11" fill="#ED7100"/><text x="571" y="1059.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
<text x="590" y="1060" font-size="13" fill="#374151">Textract AnalyzeExpense reads merchant, date, total, GST</text>
<circle cx="571" cy="1085" r="11" fill="#ED7100"/><text x="571" y="1089.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">9</text>
<text x="590" y="1090" font-size="13" fill="#374151">Expense saved to DynamoDB; month total compared with budget</text>
<circle cx="571" cy="1115" r="11" fill="#ED7100"/><text x="571" y="1119.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text>
<text x="590" y="1120" font-size="13" fill="#374151">If over budget, alert published to SNS</text>
