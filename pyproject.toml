[project]
name = "smart-expense-tracker-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["boto3>=1.35,<2", "tzdata>=2025.1"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "moto[dynamodb,s3,sns]>=5,<6",
    "cfn-lint>=1,<2",
    "aws-sam-translator>=1,<2",
]

[tool.pytest.ini_options]
pythonpath = ["code/backend"]
testpaths = ["code/tests"]
addopts = "-ra"
